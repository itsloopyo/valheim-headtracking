[Inversion]

## Invert yaw axis. When enabled, looking left moves camera right.
# Setting type: Boolean
# Default value: false
InvertYaw = false

## Invert pitch axis. When enabled, looking up moves camera down.
# Setting type: Boolean
# Default value: false
InvertPitch = false

## Invert roll axis. When enabled, tilting left tilts camera right.
# Setting type: Boolean
# Default value: false
InvertRoll = false

[Network]

## UDP port for OpenTrack data. Requires game restart to take effect.
# Setting type: Int32
# Default value: 4242
# Acceptable value range: From 1024 to 65535
UdpPort = 4242

[Position]

## Maximum upward vertical displacement in meters
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 1.5
PositionLimitY = 0.6

## Maximum downward vertical displacement in meters
# Setting type: Single
# Default value: 0.4
# Acceptable value range: From 0 to 1.5
PositionLimitYDown = 0.4

[Sensitivity]

## Yaw (left/right) sensitivity multiplier
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
YawSensitivity = 1

## Pitch (up/down) sensitivity multiplier
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
PitchSensitivity = 1

## Roll (tilt) sensitivity multiplier
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.1 to 3
RollSensitivity = 1

[Smoothing]

## Smoothing applied when the tracker runs on this machine (loopback). 0 = no smoothing, 1 = heavy.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
LocalSmoothing = 0

## Smoothing applied when the tracker is a remote device on the network. 0 = no smoothing, 1 = heavy.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
RemoteSmoothing = 0.15

