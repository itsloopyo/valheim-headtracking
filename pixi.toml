[workspace]
name = "valheim-head-tracking"
# Mirrors src/ValheimHeadTracking/ValheimHeadTracking.csproj <Version>.
# release.ps1 keeps these in sync; csproj is canonical.
version = "0.3.0"
description = "Head tracking mod for Valheim with aim decoupling"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
sync = "git submodule update --remote cameraunlock-core"
setup = "powershell -ExecutionPolicy Bypass -File scripts/setup-libs.ps1"
restore = "dotnet restore src/ValheimHeadTracking/ValheimHeadTracking.csproj"
build = { cmd = "dotnet build src/ValheimHeadTracking/ValheimHeadTracking.csproj -c Release", depends-on = ["setup", "restore"] }
# Checks that every member reference the build emits resolves against the
# assemblies it binds to at runtime. Stub/engine shape drift (a property
# declared as a field, or the reverse) compiles cleanly and only fails in
# game. Needs the game installed; skips and succeeds without it.
verify-refs = { cmd = "powershell -ExecutionPolicy Bypass -File cameraunlock-core/scripts/verify-assembly-refs.ps1 -GameId valheim -BuildDir src/ValheimHeadTracking/bin/Release", depends-on = ["build"] }
# The config tests, among them the differential test in tests/config_differential, which holds
# the legacy import to the v0.3.0 reader it replaces on every published build's first-run file
# and on core's mutation corpus, then core's canonical config lint over the committed file and
# every file the test migrated.
test = { cmd = "dotnet test tests/ValheimHeadTracking.Tests/ValheimHeadTracking.Tests.csproj -c Release && node tests/config_differential/lint-migrated.mjs tests/ValheimHeadTracking.Tests/bin/Release/net48/migrated", depends-on = ["build"] }
# Rewrites config/CameraUnlock.ini from the config table after a change to a row, a comment or a
# default. The render test compares the two on every `pixi run test`, so the committed file cannot
# drift from the code.
render-config = { cmd = "dotnet test tests/ValheimHeadTracking.Tests/ValheimHeadTracking.Tests.csproj -c Release --filter FullyQualifiedName~ConfigTests.CommittedFileIsTheRenderedDefaults && node cameraunlock-core/scripts/encode-seed.mjs", env = { CAMERAUNLOCK_RENDER_CONFIG = "write" }, depends-on = ["build"] }
# Bump vendored mod-loader copies to latest upstream within pinned range.
# Manual; commit the result. CI does not run this.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"
install = { cmd ="powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }
uninstall = "scripts\\uninstall.cmd"
clean = "dotnet clean src/ValheimHeadTracking/ValheimHeadTracking.csproj"

# Checks the launcher contract against the built installer ZIP, and that the Nexus ZIP carries
# no config.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

# Validate release readiness (optional pre-check)
validate-release = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1"

# Release workflow: pixi run release <major|minor|patch|X.Y.Z>
# Updates csproj version, commits, tags, and pushes to trigger CI release
release = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1"
