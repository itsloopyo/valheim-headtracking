## Settings file was created by plugin Valheim Head Tracking v0.2.2
## Plugin GUID: com.cameraunlock.valheim.headtracking

[Aim Decoupling]

## Decouple aim direction from head tracking. When enabled, projectiles and attacks go where your mouse aims, not where your head is looking.
# Setting type: Boolean
# Default value: true
EnableAimDecoupling = true

## Move crosshair to show actual aim position when decoupled. When disabled, crosshair stays centered but aim still goes to mouse position.
# Setting type: Boolean
# Default value: true
ShowDecoupledCrosshair = true

[General]

## Enable head tracking automatically when the game loads
# Setting type: Boolean
# Default value: true
EnableOnStartup = true

## Yaw mode: true = horizon-locked yaw (default), false = camera-local. Horizon-locked keeps yaw around the world up-axis at any pitch. Camera-local rotates around the view's current up-axis, which produces leaning at extreme pitches.
# Setting type: Boolean
# Default value: true
WorldSpaceYaw = true

[Hotkeys]

